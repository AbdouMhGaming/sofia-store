openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: SOFIA STORE shared retail API. Initial foundation and catalog phase.
servers:
  - url: /api
paths:
  /admin/reports:
    get:
      operationId: getRetailReport
      parameters: &reportParameters
        - { in: query, name: from, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { in: query, name: to, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { in: query, name: groupBy, schema: { type: string, enum: [DAY, MONTH], default: DAY } }
        - { in: query, name: channel, schema: { type: string, enum: [ALL, POS, ONLINE, PICKUP, DELIVERY], default: ALL } }
        - { in: query, name: expectedFingerprint, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      responses:
        "200":
          description: Owner-only activity, actual settlements and as-of courier balances
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetailReport" }
        "400": { description: Invalid dates or more than 366 days }
        "403": { description: Owner access required }
        "409": { description: Financial data changed or inconsistent history }
        "413": { description: "Too many records; narrow the range, never a truncated report" }
  /admin/reports/export:
    get:
      operationId: exportRetailReport
      parameters: *reportParameters
      responses:
        "200":
          description: Complete filtered report and definitions, integer centimes, safe CSV text
          content:
            text/csv:
              schema: { type: string }
        "400": { description: Invalid dates }
        "403": { description: Owner access required }
        "409": { description: Financial data changed; refresh before export }
        "413": { description: Narrow the range; no partial export }
  /checkout/config:
    get:
      operationId: getCheckoutConfig
      responses:
        "200":
          description: Published checkout options, disabled until explicitly configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSettings" }
  /checkout/quote:
    post:
      operationId: quoteCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutBasket" }
      responses:
        "200":
          description: Server-priced basket; does not reserve stock
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutQuote" }
  /checkout/orders:
    post:
      operationId: placeCheckoutOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutSubmission" }
      responses:
        "200":
          description: Order saved once with reserved stock; no cash collected online
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOrder" }
  /checkout/recover:
    post:
      operationId: recoverCheckoutOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutAccess" }
      responses:
        "200":
          description: Capability-protected saved order without exposing address or full phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutOrder" }
  /checkout/cancel-request:
    post:
      operationId: cancelCheckoutRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutAccess" }
      responses:
        "200":
          description: Durable abandonment or the previously committed order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutCancellation" }
  /admin/checkout-settings:
    get:
      operationId: getAdminCheckoutSettings
      responses:
        "200":
          description: Owner-controlled checkout configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSettings" }
    put:
      operationId: saveAdminCheckoutSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutSettings" }
      responses:
        "200":
          description: Saved and validated checkout configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckoutSettings" }
  /admin/orders:
    get:
      operationId: listAdminOrders
      parameters:
        - { in: query, name: before, schema: { type: integer, minimum: 1 } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/WebOrderStatus" } }
        - { in: query, name: payment, schema: { type: string, enum: [UNPAID, COURIER_DUE, RECEIVED, REFUNDED] } }
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Protected orders, newest first
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderPage" }
  /admin/orders/{id}:
    get:
      operationId: getAdminOrder
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Protected order details and reservation events
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCheckoutOrder" }
  /admin/orders/{id}/cancel:
    post:
      operationId: cancelAdminOrder
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderCancellationReason" }
      responses:
        "200":
          description: Cancelled order with its stock reservation released exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCheckoutOrder" }
  /admin/orders/{id}/actions:
    post:
      operationId: actOnAdminOrder
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebOrderAction" }
      responses:
        "200":
          description: Order operation applied once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCheckoutOrder" }
  /admin/orders/{id}/payments:
    post:
      operationId: recordAdminOrderPayment
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebOrderPaymentInput" }
      responses:
        "200":
          description: Actual store receipt or refund recorded once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCheckoutOrder" }
  /admin/orders/{id}/requests/{requestId}:
    get:
      operationId: recoverAdminOrderRequest
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
        - { in: path, name: requestId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Saved result; a missing request does not prove it cannot commit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebOrderRequestResult" }
  /admin/orders/{id}/requests/cancel:
    post:
      operationId: abandonAdminOrderRequest
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebOrderRequestKey" }
      responses:
        "200":
          description: Existing committed result or durable cancellation marker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebOrderRequestResult" }
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /store:
    get:
      operationId: getStore
      responses:
        "200":
          description: Public store identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
  /categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /products:
    get:
      operationId: listProducts
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200":
          description: Public products; preview products cannot be purchased
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{slug}:
    get:
      operationId: getProduct
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session and CSRF token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordInput" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/activate:
    post:
      operationId: activateOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationInput" }
      responses:
        "201":
          description: One-time credential, never returned again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationResult" }
  /admin/summary:
    get:
      operationId: getAdminSummary
      responses:
        "200":
          description: Actual catalog statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /admin/products:
    get:
      operationId: listAdminProducts
      responses:
        "200":
          description: All products including archived
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminProduct" }
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
  /admin/products/{id}:
    put:
      operationId: updateProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated or safely archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
  /admin/products/{id}/variants:
    post:
      operationId: createVariant
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "201":
          description: Created with zero stock; receive stock through adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
  /admin/inventory:
    get:
      operationId: listInventory
      responses:
        "200":
          description: Shared variant balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryRow" }
  /admin/inventory/adjust:
    post:
      operationId: adjustStock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustmentInput" }
      responses:
        "200":
          description: Stock adjustment saved once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/activity:
    get:
      operationId: listActivity
      responses:
        "200":
          description: Actual inventory and catalog activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
  /media/{id}/{version}:
    get:
      operationId: getMediaImage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: string, enum: [image, thumbnail] } }
      responses:
        "200":
          description: Validated optimized image; public only when attached to a visible product
          content:
            image/webp:
              schema: { type: string, format: binary }
  /admin/categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
  /admin/categories/{id}:
    put:
      operationId: updateCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    delete:
      operationId: deleteCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Empty category removed; referenced categories cannot be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/variants/{id}:
    put:
      operationId: updateVariant
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "200":
          description: Variant metadata updated; stock never changed here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryRow" }
  /admin/stock-movements:
    get:
      operationId: listStockMovements
      parameters:
        - { name: variantId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Attributed stock movement history with cursor pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementPage" }
  /admin/catalog/export:
    get:
      operationId: exportCatalog
      responses:
        "200":
          description: Catalog CSV with integer centimes; no stock import
          content:
            text/csv:
              schema: { type: string }
  /admin/catalog/import:
    post:
      operationId: importCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogImportInput" }
      responses:
        "200":
          description: Preview or atomic import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportResult" }
  /admin/media:
    get:
      operationId: listMedia
      responses:
        "200":
          description: Durable media library and storage availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLibrary" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Same-origin upload URL bound to the authenticated staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
  /storage/uploads/{id}:
    put:
      operationId: putMediaUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Raw photo received privately; must be validated before attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/media/{id}/complete:
    post:
      operationId: completeMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Validated and optimized image, ready to attach
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
  /admin/media/{id}:
    delete:
      operationId: deleteMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Unused image removed from the library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /pos/context:
    get:
      operationId: getPosContext
      responses:
        "200":
          description: Current staff permissions, physical drawer and receipt configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosContext" }
  /pos/variants:
    get:
      operationId: searchPosVariants
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Up to 40 matching sellable catalog variants, including out-of-stock variants
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PosVariant" } }
  /pos/lookup:
    get:
      operationId: lookupPosBarcode
      parameters:
        - { name: barcode, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 80 } }
      responses:
        "200":
          description: Exact case-sensitive barcode match, preserving leading zeros
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosVariant" }
  /pos/register-sessions:
    get:
      operationId: listRegisterSessions
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Drawer history, restricted to own sessions for cashiers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterPage" }
    post:
      operationId: openRegister
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterOpening" }
      responses:
        "200":
          description: Opened drawer session, or the identical previous request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterSession" }
  /pos/register-sessions/{id}/close:
    post:
      operationId: closeRegister
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterClosing" }
      responses:
        "200":
          description: Counted cash and variance saved atomically, without deleting history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterSession" }
  /pos/sales:
    get:
      operationId: listPosSales
      parameters:
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Receipt history, restricted to own sales for cashiers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalePage" }
    post:
      operationId: createPosSale
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CashSaleInput" }
      responses:
        "200":
          description: Committed cash sale, receipt and stock movements, or identical previous request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSale" }
  /pos/sales/by-request/{requestId}:
    get:
      operationId: recoverPosSale
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string, minLength: 16, maxLength: 100 } }
      responses:
        "200":
          description: Recover a completed checkout after an uncertain network response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSale" }
  /pos/sales/cancel-request:
    post:
      operationId: cancelPosSaleRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosSaleCancellation" }
      responses:
        "200":
          description: Durable cancellation of an uncommitted request, or its already committed sale
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleCancellationResult" }
  /pos/refunds/cancel-request:
    post:
      operationId: cancelPosRefundRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PosRefundCancellation" }
      responses:
        "200":
          description: Durable cancellation of an uncommitted refund, or the confirmed original sale with refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleCancellationResult" }
  /pos/register-sessions/cancel-request:
    post:
      operationId: cancelRegisterRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterCancellation" }
      responses:
        "200":
          description: Durable cancellation of an opening/closing attempt, or the already confirmed session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegisterCancellationResult" }
  /pos/sales/{id}:
    get:
      operationId: getPosSale
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Immutable sale snapshots, cash payment and attributed refunds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSale" }
  /pos/sales/{id}/refunds:
    post:
      operationId: refundPosSale
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundInput" }
      responses:
        "200":
          description: Manager-authorized cash refund or compensating void; original sale is preserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PosSale" }
  /pos/receipt-settings:
    put:
      operationId: updateReceiptSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceiptSettings" }
      responses:
        "200":
          description: Manager-only store details used by future receipts, not historical receipts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReceiptSettings" }
components:
  schemas:
    ReportActivity:
      type: object
      required: [unitsSold, unitsReturned, grossMinor, discountMinor, returnsMinor, netMinor, costSoldMinor, costRecoveredMinor, damagedUnfulfilledMinor, netCostMinor, marginMinor]
      properties:
        unitsSold: { type: integer }
        unitsReturned: { type: integer }
        grossMinor: { type: integer }
        discountMinor: { type: integer }
        returnsMinor: { type: integer }
        netMinor: { type: integer }
        costSoldMinor: { type: integer }
        costRecoveredMinor: { type: integer }
        damagedUnfulfilledMinor: { type: integer }
        netCostMinor: { type: integer }
        marginMinor: { type: integer }
    ReportMoney:
      type: object
