      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [categoryId]
          properties:
            categoryId: { type: integer }
    ProductInput:
      type: object
      required: [nameFr, nameAr, descriptionFr, descriptionAr, categoryId, featured, status, images]
      properties:
        nameFr: { type: string, minLength: 1, maxLength: 150 }
        nameAr: { type: string, maxLength: 150 }
        descriptionFr: { type: string, maxLength: 5000 }
        descriptionAr: { type: string, maxLength: 5000 }
        categoryId: { type: integer, minimum: 1 }
        featured: { type: boolean }
        status: { type: string, enum: [PREVIEW, ACTIVE, ARCHIVED] }
        images:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 500 }
    VariantInput:
      type: object
      required: [sku, barcode, size, color, priceMinor, costMinor]
      properties:
        sku: { type: string, minLength: 1, maxLength: 80 }
        barcode: { type: string, minLength: 1, maxLength: 80 }
        size: { type: string, minLength: 1, maxLength: 30 }
        color: { type: string, minLength: 1, maxLength: 60 }
        priceMinor: { type: integer, minimum: 1, maximum: 100000000 }
        costMinor: { type: integer, minimum: 0, maximum: 100000000 }
    User:
      type: object
      required: [id, email, role, mustChangePassword]
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string, enum: [STORE_OWNER, MANAGER, CASHIER] }
        mustChangePassword: { type: boolean }
    Session:
      type: object
      required: [user, csrfToken, setupRequired, setupEnabled]
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        csrfToken: { type: string }
        setupRequired: { type: boolean }
        setupEnabled: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    PasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 200 }
        newPassword: { type: string, minLength: 14, maxLength: 200 }
    ActivationInput:
      type: object
      required: [email, token]
      properties:
        email: { type: string, format: email }
        token: { type: string, minLength: 24, maxLength: 200 }
    ActivationResult:
      type: object
      required: [email, temporaryPassword]
      properties:
        email: { type: string }
        temporaryPassword: { type: string }
    Summary:
      type: object
      required: [products, variants, availableUnits, reservedUnits, lowStock, valuationMinor, recentActivity]
      properties:
        products: { type: integer }
        variants: { type: integer }
        availableUnits: { type: integer }
        reservedUnits: { type: integer }
        lowStock: { type: integer }
        valuationMinor: { type: integer }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    InventoryRow:
      type: object
      required: [id, productId, productName, image, sku, barcode, size, color, priceMinor, costMinor, onHand, reserved, available]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        image: { type: string }
        sku: { type: string }
        barcode: { type: string }
        size: { type: string }
        color: { type: string }
        priceMinor: { type: integer }
        costMinor: { type: integer }
        onHand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    AdjustmentInput:
      type: object
      required: [variantId, quantity, reason, kind, requestId]
      properties:
        variantId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: -100000, maximum: 100000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
        kind: { type: string, enum: [RECEIPT, ADJUSTMENT, DAMAGE, RETURN] }
        requestId: { type: string, minLength: 16, maxLength: 100 }
    Activity:
      type: object
      required: [id, action, detail, createdAt, actor]
      properties:
        id: { type: integer }
        action: { type: string }
        detail: { type: string }
        createdAt: { type: string }
        actor: { type: string }
    CategoryInput:
      type: object
      required: [slug, nameFr, nameAr]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
        nameFr: { type: string, minLength: 1, maxLength: 150 }
        nameAr: { type: string, minLength: 1, maxLength: 150 }
    StockMovement:
      type: object
      required: [id, variantId, productName, sku, size, color, quantity, kind, reason, balanceAfter, actor, createdAt]
      properties:
        id: { type: integer }
        variantId: { type: integer }
        productName: { type: string }
        sku: { type: string }
        size: { type: string }
        color: { type: string }
        quantity: { type: integer }
        kind: { type: string }
        reason: { type: string }
        balanceAfter: { type: integer }
        actor: { type: string }
        createdAt: { type: string }
    MovementPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StockMovement" }
        nextCursor: { type: [integer, "null"] }
    CatalogImportInput:
      type: object
      required: [csv, dryRun, requestId]
      properties:
        csv: { type: string, minLength: 1, maxLength: 200000 }
        dryRun: { type: boolean }
        requestId: { type: string, minLength: 16, maxLength: 100 }
    CatalogImportResult:
      type: object
      required: [valid, committed, products, variants, errors, warnings]
      properties:
        valid: { type: boolean }
        committed: { type: boolean }
        products: { type: integer }
        variants: { type: integer }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    MediaAsset:
      type: object
      required: [id, name, path, thumbnailPath, width, height, bytes]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        thumbnailPath: { type: string }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer }
    MediaLibrary:
      type: object
      required: [enabled, items]
      properties:
        enabled: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 190 }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    UploadTicket:
      type: object
      required: [uploadId, uploadURL, objectPath]
      properties:
        uploadId: { type: string }
        uploadURL: { type: string }
        objectPath: { type: string }
