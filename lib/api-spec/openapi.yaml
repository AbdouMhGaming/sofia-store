openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: SOFIA STORE shared retail API. Initial foundation and catalog phase.
servers:
  - url: /api
paths:
  /healthz:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /store:
    get:
      operationId: getStore
      responses:
        "200":
          description: Public store identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Store" }
  /categories:
    get:
      operationId: listCategories
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
  /products:
    get:
      operationId: listProducts
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200":
          description: Public products; preview products cannot be purchased
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Product" }
  /products/{slug}:
    get:
      operationId: getProduct
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
  /auth/session:
    get:
      operationId: getSession
      responses:
        "200":
          description: Current session and CSRF token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/logout:
    post:
      operationId: logout
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /auth/password:
    post:
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordInput" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
  /auth/activate:
    post:
      operationId: activateOwner
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActivationInput" }
      responses:
        "201":
          description: One-time credential, never returned again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivationResult" }
  /admin/summary:
    get:
      operationId: getAdminSummary
      responses:
        "200":
          description: Actual catalog statistics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /admin/products:
    get:
      operationId: listAdminProducts
      responses:
        "200":
          description: All products including archived
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminProduct" }
    post:
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
  /admin/products/{id}:
    put:
      operationId: updateProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Updated or safely archived
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProduct" }
  /admin/products/{id}/variants:
    post:
      operationId: createVariant
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "201":
          description: Created with zero stock; receive stock through adjustment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Variant" }
  /admin/inventory:
    get:
      operationId: listInventory
      responses:
        "200":
          description: Shared variant balances
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/InventoryRow" }
  /admin/inventory/adjust:
    post:
      operationId: adjustStock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdjustmentInput" }
      responses:
        "200":
          description: Stock adjustment saved once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/activity:
    get:
      operationId: listActivity
      responses:
        "200":
          description: Actual inventory and catalog activity
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Activity" }
  /media/{id}/{version}:
    get:
      operationId: getMediaImage
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: string, enum: [image, thumbnail] } }
      responses:
        "200":
          description: Validated optimized image; public only when attached to a visible product
          content:
            image/webp:
              schema: { type: string, format: binary }
  /admin/categories:
    post:
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
  /admin/categories/{id}:
    put:
      operationId: updateCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
    delete:
      operationId: deleteCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Empty category removed; referenced categories cannot be deleted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/variants/{id}:
    put:
      operationId: updateVariant
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VariantInput" }
      responses:
        "200":
          description: Variant metadata updated; stock never changed here
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryRow" }
  /admin/stock-movements:
    get:
      operationId: listStockMovements
      parameters:
        - { name: variantId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Attributed stock movement history with cursor pagination
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovementPage" }
  /admin/catalog/export:
    get:
      operationId: exportCatalog
      responses:
        "200":
          description: Catalog CSV with integer centimes; no stock import
          content:
            text/csv:
              schema: { type: string }
  /admin/catalog/import:
    post:
      operationId: importCatalog
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CatalogImportInput" }
      responses:
        "200":
          description: Preview or atomic import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogImportResult" }
  /admin/media:
    get:
      operationId: listMedia
      responses:
        "200":
          description: Durable media library and storage availability
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaLibrary" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Same-origin upload URL bound to the authenticated staff member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTicket" }
  /storage/uploads/{id}:
    put:
      operationId: putMediaUpload
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Raw photo received privately; must be validated before attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
  /admin/media/{id}/complete:
    post:
      operationId: completeMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Validated and optimized image, ready to attach
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaAsset" }
  /admin/media/{id}:
    delete:
      operationId: deleteMedia
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Unused image removed from the library
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Message:
      type: object
      required: [message]
      properties:
        message: { type: string }
    Store:
      type: object
      required: [name, phone, location, instagram, facebook, tiktok, commerceEnabled]
      properties:
        name: { type: string }
        phone: { type: string }
        location: { type: string }
        instagram: { type: string }
        facebook: { type: string }
        tiktok: { type: string }
        commerceEnabled: { type: boolean }
    Category:
      type: object
      required: [id, slug, nameFr, nameAr]
      properties:
        id: { type: integer }
        slug: { type: string }
        nameFr: { type: string }
        nameAr: { type: string }
    Product:
      type: object
      required: [id, slug, nameFr, nameAr, descriptionFr, descriptionAr, category, images, featured, status, variants]
      properties:
        id: { type: integer }
        slug: { type: string }
        nameFr: { type: string }
        nameAr: { type: string }
        descriptionFr: { type: string }
        descriptionAr: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        images:
          type: array
          items: { type: string }
        featured: { type: boolean }
        status: { type: string, enum: [PREVIEW, ACTIVE, ARCHIVED] }
        variants:
          type: array
          items: { $ref: "#/components/schemas/Variant" }
    Variant:
      type: object
      required: [id, sku, barcode, size, color, priceMinor, available]
      properties:
        id: { type: integer }
        sku: { type: string }
        barcode: { type: string }
        size: { type: string }
        color: { type: string }
        priceMinor: { type: integer }
        available: { type: integer }
    AdminProduct:
      allOf:
        - $ref: "#/components/schemas/Product"
        - type: object
          required: [categoryId]
          properties:
            categoryId: { type: integer }
    ProductInput:
      type: object
      required: [nameFr, nameAr, descriptionFr, descriptionAr, categoryId, featured, status, images]
      properties:
        nameFr: { type: string, minLength: 1, maxLength: 150 }
        nameAr: { type: string, maxLength: 150 }
        descriptionFr: { type: string, maxLength: 5000 }
        descriptionAr: { type: string, maxLength: 5000 }
        categoryId: { type: integer, minimum: 1 }
        featured: { type: boolean }
        status: { type: string, enum: [PREVIEW, ACTIVE, ARCHIVED] }
        images:
          type: array
          maxItems: 12
          items: { type: string, maxLength: 500 }
    VariantInput:
      type: object
      required: [sku, barcode, size, color, priceMinor, costMinor]
      properties:
        sku: { type: string, minLength: 1, maxLength: 80 }
        barcode: { type: string, minLength: 1, maxLength: 80 }
        size: { type: string, minLength: 1, maxLength: 30 }
        color: { type: string, minLength: 1, maxLength: 60 }
        priceMinor: { type: integer, minimum: 1, maximum: 100000000 }
        costMinor: { type: integer, minimum: 0, maximum: 100000000 }
    User:
      type: object
      required: [id, email, role, mustChangePassword]
      properties:
        id: { type: integer }
        email: { type: string }
        role: { type: string, enum: [STORE_OWNER, MANAGER, CASHIER] }
        mustChangePassword: { type: boolean }
    Session:
      type: object
      required: [user, csrfToken, setupRequired, setupEnabled]
      properties:
        user:
          anyOf:
            - $ref: "#/components/schemas/User"
            - type: "null"
        csrfToken: { type: string }
        setupRequired: { type: boolean }
        setupEnabled: { type: boolean }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 200 }
    PasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 200 }
        newPassword: { type: string, minLength: 14, maxLength: 200 }
    ActivationInput:
      type: object
      required: [email, token]
      properties:
        email: { type: string, format: email }
        token: { type: string, minLength: 24, maxLength: 200 }
    ActivationResult:
      type: object
      required: [email, temporaryPassword]
      properties:
        email: { type: string }
        temporaryPassword: { type: string }
    Summary:
      type: object
      required: [products, variants, availableUnits, reservedUnits, lowStock, valuationMinor, recentActivity]
      properties:
        products: { type: integer }
        variants: { type: integer }
        availableUnits: { type: integer }
        reservedUnits: { type: integer }
        lowStock: { type: integer }
        valuationMinor: { type: integer }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/Activity" }
    InventoryRow:
      type: object
      required: [id, productId, productName, image, sku, barcode, size, color, priceMinor, costMinor, onHand, reserved, available]
      properties:
        id: { type: integer }
        productId: { type: integer }
        productName: { type: string }
        image: { type: string }
        sku: { type: string }
        barcode: { type: string }
        size: { type: string }
        color: { type: string }
        priceMinor: { type: integer }
        costMinor: { type: integer }
        onHand: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    AdjustmentInput:
      type: object
      required: [variantId, quantity, reason, kind, requestId]
      properties:
        variantId: { type: integer, minimum: 1 }
        quantity: { type: integer, minimum: -100000, maximum: 100000 }
        reason: { type: string, minLength: 3, maxLength: 500 }
        kind: { type: string, enum: [RECEIPT, ADJUSTMENT, DAMAGE, RETURN] }
        requestId: { type: string, minLength: 16, maxLength: 100 }
    Activity:
      type: object
      required: [id, action, detail, createdAt, actor]
      properties:
        id: { type: integer }
        action: { type: string }
        detail: { type: string }
        createdAt: { type: string }
        actor: { type: string }
    CategoryInput:
      type: object
      required: [slug, nameFr, nameAr]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
        nameFr: { type: string, minLength: 1, maxLength: 150 }
        nameAr: { type: string, minLength: 1, maxLength: 150 }
    StockMovement:
      type: object
      required: [id, variantId, productName, sku, size, color, quantity, kind, reason, balanceAfter, actor, createdAt]
      properties:
        id: { type: integer }
        variantId: { type: integer }
        productName: { type: string }
        sku: { type: string }
        size: { type: string }
        color: { type: string }
        quantity: { type: integer }
        kind: { type: string }
        reason: { type: string }
        balanceAfter: { type: integer }
        actor: { type: string }
        createdAt: { type: string }
    MovementPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/StockMovement" }
        nextCursor: { type: [integer, "null"] }
    CatalogImportInput:
      type: object
      required: [csv, dryRun, requestId]
      properties:
        csv: { type: string, minLength: 1, maxLength: 200000 }
        dryRun: { type: boolean }
        requestId: { type: string, minLength: 16, maxLength: 100 }
    CatalogImportResult:
      type: object
      required: [valid, committed, products, variants, errors, warnings]
      properties:
        valid: { type: boolean }
        committed: { type: boolean }
        products: { type: integer }
        variants: { type: integer }
        errors:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    MediaAsset:
      type: object
      required: [id, name, path, thumbnailPath, width, height, bytes]
      properties:
        id: { type: string }
        name: { type: string }
        path: { type: string }
        thumbnailPath: { type: string }
        width: { type: integer }
        height: { type: integer }
        bytes: { type: integer }
    MediaLibrary:
      type: object
      required: [enabled, items]
      properties:
        enabled: { type: boolean }
        items:
          type: array
          items: { $ref: "#/components/schemas/MediaAsset" }
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 190 }
        size: { type: integer, minimum: 1, maximum: 8388608 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    UploadTicket:
      type: object
      required: [uploadId, uploadURL, objectPath]
      properties:
        uploadId: { type: string }
        uploadURL: { type: string }
        objectPath: { type: string }
